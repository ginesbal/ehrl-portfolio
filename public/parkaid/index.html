<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
  <title>parkaid</title>
  <script>
    // Embedded in the portfolio's demo dialog (same origin): Esc closes it even while the app has focus.
    addEventListener('keydown', function (e) {
      var dialog = e.key === 'Escape' && window.frameElement && window.frameElement.closest('dialog')
      if (dialog) dialog.close()
    })
    // The demo's data covers downtown Calgary only, so location is always off, as in the dialog's
    // iframe (allow="geolocation 'none'"): opened in its own tab, the app falls back to downtown too.
    if (navigator.geolocation) {
      var denied = function (ok, fail) {
        setTimeout(function () { if (fail) fail({ code: 1, PERMISSION_DENIED: 1, message: 'Location is off in this demo' }) })
        return 0
      }
      navigator.geolocation.getCurrentPosition = denied
      navigator.geolocation.watchPosition = denied
    }
  </script>

    html,
    body {
      height: 100%;
      width: 100%;
    }

    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #root {
      display: flex;
      height: 100%;
      width: 100%;
      flex: 1;
      padding: 0;
    }
  </style>
</head>
